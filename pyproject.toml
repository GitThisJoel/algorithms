[project]
name = "algorithms"
version = "0.0.0"
requires-python = ">=3.15"
dependencies = ["ruff>=0.17.4"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["I", "TID", "F", "E", "W", "B", "UP", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true
